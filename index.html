let life=1,rr={},mute=ls.get('tr_mute')==='1',deck=[],single=0,mx=0,pre,up,fails=0,wd,started,mode=ls.get('tr_mode')||'Classic',cat,pool,r,me,rv,cur,done,t0,tick,nt,rec,streak,LIM;
const root=document.getElementById('app');
const view=h=>{root.innerHTML=h+'<footer>Music previews provided by Deezer · <a href="privacy.html" style="color:inherit">Privacy</a></footer>'};
function askName(first){au.pause();
 view(`<div class="hero"><div class="mark">♪</div><h1 style="font-size:32px">${first?'Welcome':'Your name'}</h1><p class="tag">${first?'What should we call you?':'Change how you appear in games.'}</p></div>
 <input id="ni" class="inp" maxlength="14" placeholder="Your nickname" autocomplete="off" value="${first?'':esc(ls.get('tr_name')||'')}">
 <button class="btn" id="ok">${first?'Let’s play':'Save'}</button>${first?'<button class="btn g" id="sk">Skip for now</button>':''}`);
 const go=v=>{v=(v||'').trim().slice(0,14);if(v)ls.set('tr_name',v);else if(first)ls.set('tr_name','Player');first?home():profile()};
 $('ok').onclick=()=>go($('ni').value);$('ni').onkeydown=e=>{if(e.key==='Enter')go($('ni').value)};
 if($('sk'))$('sk').onclick=()=>go('')}
function profile(){au.pause();const t=stats(),acc=t.played?Math.round(t.correct/t.played*100):0,wr=t.games?Math.round(t.wins/t.games*100):0;
 const bs=(()=>{try{return Object.keys(localStorage).filter(k=>k.startsWith('tr_best_')).map(k=>[k.slice(8),+localStorage.getItem(k)]).sort((a,b)=>b[1]-a[1]).slice(0,8)}catch(e){return[]}})();
 const bsHtml=bs.length?`<h2 style="margin:6px 0 0"><span>Records</span>Best scores</h2><div class="rec">${bs.map(([k,v])=>`<div><span style="flex:1">${esc(k)}</span><b>${v}</b></div>`).join('')}</div>`:'';
 const box=(v,l)=>`<div style="flex:1 1 40%"><b>${v}</b><span>${l}</span></div>`;
 view(`<div class="top"><button class="x" id="bk">←</button><span class="mu">Profile</span><span style="width:38px"></span></div>
 <div class="hero"><div class="mark" style="font-family:var(--serif)">${esc(Array.from(nm())[0].toUpperCase())}</div><h1 style="font-size:32px">${esc(nm())}</h1></div>
 <div class="vs" style="flex-wrap:wrap">${box(t.games,'Games')}${box(t.wins,'Wins')}${box(wr+'%','Win rate')}${box(t.correct,'Songs named')}${box(acc+'%','Accuracy')}${box(t.best,'Best streak')}</div>
 ${bsHtml}<button class="btn" id="cn">Change name</button><button class="btn g" id="rs">Reset my stats</button>`);
 $('bk').onclick=()=>home();$('cn').onclick=()=>askName(0);
 $('rs').onclick=()=>{if(confirm('Reset all your stats and best scores?')){try{Object.keys(localStorage).filter(k=>k.startsWith('tr_best_')||k==='tr_stats').forEach(k=>localStorage.removeItem(k))}catch(e){}profile()}}}
function jsonp(u){return new Promise((res,rej)=>{const cb='cb'+Math.random().toString(36).slice(2),s=document.createElement('script');
 const end=()=>{s.remove();delete window[cb]};window[cb]=d=>{end();res(d)};s.onerror=()=>{end();rej()};
 s.src=u+'&output=jsonp&callback='+cb;document.head.appendChild(s);setTimeout(()=>{end();rej()},9000)})}
const api=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>jsonp(u));
function home(msg){au.pause();clearInterval(tick);clearTimeout(nt);
 let h=`<div class="top"><span class="mu">Hi, ${esc(nm())}</span><div style="display:flex;gap:8px"><button class="av" id="th" aria-label="Switch theme">${theme==='light'?'☾':'☀'}</button><button class="av" id="pf">${esc(Array.from(nm())[0].toUpperCase())}</button></div></div><div class="hero"><div class="mark">♪</div><h1>Tune<em>Race</em></h1><p class="tag">Name the song. Beat the clock. Outrun your rival.</p></div>
 ${msg?`<p class="fb" style="color:var(--bad)">${esc(msg)}</p>`:''}
 <div class="chips">${Object.keys(MODES).map(m=>`<button class="chip ${m===mode?'on':''}" data-m="${m}">${m}<small>${MODES[m][0]}s per song</small></button>`).join('')}</div>
 <div class="grid"><button class="card feat" data-k="Mix" style="background:linear-gradient(120deg,#4a3410,#14141c)">${art('Mix It Up','stars')}<b>Mix It Up</b><small>Random artists from every section</small><i>★</i></button></div>`;
 G.forEach(s=>{h+=`<div><h2><span>${esc(s.s)}</span>${esc(s.g)}</h2><div class="grid">${s.items.map(c=>{const b=ls.get('tr_best_'+c.k);
  return `<button class="card" data-k="${esc(c.k)}" style="background:linear-gradient(160deg,${c.c},#101018)">${art(c.k,MO[c.k])}<i>${c.e}</i><b>${esc(c.k)}</b><small>${esc(c.a.slice(0,3).join(', '))}…</small></button>`}).join('')}</div></div>`});
 SP.forEach((g,gi)=>{h+=`<div><h2><span>${esc(g.s)}</span>${esc(g.g)}</h2><div class="row">${g.l.map(([n,t],i)=>{const k=n+': '+t,b=ls.get('tr_best_'+k);
  return `<button class="card" data-k="${esc(k)}" style="background:linear-gradient(160deg,${PAL[(i+gi*3)%8]},#101018)">${art(n)}<i>★</i><b>${esc(n)}</b><small>${esc(t)}</small></button>`}).join('')}</div></div>`});
 view(h);$('pf').onclick=profile;$('th').onclick=()=>{applyTheme(theme==='light'?'dark':'light');home(msg)};
 root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{mode=b.dataset.m;ls.set('tr_mode',mode);home(msg)});
 root.querySelectorAll('.card').forEach(b=>b.onclick=()=>load(b.dataset.k))}
const D={req:0,ok:0,res:0,prev:0,match:0,err:''};
const diag=()=>D.ok+'/'+D.req+' calls ok, '+D.res+' results, '+D.match+' matched'+(D.err?', '+D.err:'');
async function fetchArtist(a,deep){
 const n=norm(a),q=a.replace(/’/g,"'"),out=[];
 const take=r=>{const d=(r&&r.data)||[];D.res+=d.length;if(r&&r.error&&!D.err)D.err=r.error.message||'api error';
  d.forEach(t=>{if(!t.preview)return;D.prev++;if(t.artist&&norm(t.artist.name)===n){D.match++;out.push(t)}})};
 const call=async u=>{D.req++;try{const r=await api(u);D.ok++;take(r);return r}catch(e){}};
 await call('https://api.deezer.com/search?limit='+(deep?60:30)+'&q='+encodeURIComponent('artist:"'+q+'"'));
 if(deep&&out.length<12){const r=await call('https://api.deezer.com/search/artist?limit=5&q='+encodeURIComponent(q));
  const m=r&&(r.data||[]).find(x=>norm(x.name)===n);if(m)await call('https://api.deezer.com/artist/'+m.id+'/top?limit=50')}
 if(out.length<5)await call('https://api.deezer.com/search?limit=50&q='+encodeURIComponent(q));
 return out}
async function load(k){cat=k;
 au.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';au.play().then(()=>au.pause()).catch(()=>{});
 view(`<div class="hero"><div class="spin"></div><h2 style="text-align:center">Finding songs…</h2><p class="tag">${esc(k)}</p></div>`);
 try{
  if(!cache[k]){
   D.req=D.ok=D.res=D.prev=D.match=0;D.err='';
   const sp=SPOT.find(x=>x.k===k),names=sp?[sp.n]:k==='Mix'?sh(ALL.flatMap(c=>c.a)).slice(0,14):ALL.find(c=>c.k===k).a;
   const lists=await Promise.all(names.map(a=>fetchArtist(a,!!sp)));
   if(!D.ok)throw new Error('NET');
   const p=[],seen=new Set();
   lists.forEach(l=>l.forEach(t=>{const key=norm(t.title_short||t.title)||String(t.id);if(seen.has(key))return;seen.add(key);p.push({t:t.title_short||t.title,a:t.artist.name,p:t.preview})}));
   if(p.length<12)throw new Error('FEW');cache[k]=p}
  single=SPOT.some(x=>x.k===k)?1:0;pool=cache[k];deck=[];r=0;mx=0;life=1;me=0;rv=0;rec=[];streak=0;LIM=MODES[mode][0];next()
 }catch(e){home(e.message==='NET'?'Couldn’t reach Deezer. Check your connection and try again.':'Not enough playable songs found here ('+diag()+'). Try another section.')}}
function next(){
 if(r>=ROUNDS)return finish();
 if(deck.length<2)deck=sh(pool.slice());cur=deck.pop();up=deck[deck.length-1];done=false;
 const o=sh([cur,...sh(pool.filter(x=>x.t!==cur.t&&(single||x.a!==cur.a))).slice(0,3)]);
 view(`<div class="top"><button class="x" id="qt">✕</button><div class="sc"><div><span>${esc(nm().slice(0,10))}</span>${me}</div><div><span>Rival</span>${rv}</div></div></div>
 <div class="seg">${Array.from({length:ROUNDS},(_,i)=>`<i class="${i<r?(rec[i]&&rec[i].ok?'d':'n'):''}"></i>`).join('')}</div>
 <div class="race"><i class="rv" id="rvm">R</i><i class="me" id="mem">${esc(Array.from(nm())[0].toUpperCase())}</i></div>
 <div class="stage"><div class="ring"><svg width="112" height="112" viewBox="0 0 112 112"><circle class="b" cx="56" cy="56" r="50"/><circle class="f" id="rg" cx="56" cy="56" r="50" stroke-dasharray="314.16" stroke-dashoffset="0"/></svg><div id="tm">${LIM}</div></div>
 <div class="eq" id="eq">${'<i></i>'.repeat(14)}</div><div class="q" id="qq">Which song is playing?</div><div class="rvs" id="rs"></div></div>
 <div class="tools"><button class="tl" id="ll"></button><button class="tl" id="mt"></button></div><div class="opts" id="ops"></div><div class="fb" id="fb"></div>`);
 o.forEach((x,i)=>{const b=document.createElement('button');b.className='opt';b._o=x;
  b.innerHTML=`<u>${'ABCD'[i]}</u><span>${esc(x.t)}${single?'':`<small>${esc(x.a)}</small>`}</span>`;b.onclick=()=>pick(x,b);$('ops').appendChild(b)});
 $('qt').onclick=()=>{if(confirm('Quit this game?'))home()};
 const L=$('ll');L.textContent=life?'½ 50/50 (1)':'½ used';L.disabled=!life;
 L.onclick=()=>{if(life<1||done||!started)return;life--;L.textContent='½ used';L.disabled=true;sfx('tick');
  sh([...$('ops').children].filter(b=>b._o!==cur)).slice(0,2).forEach(b=>{b.style.visibility='hidden';b.disabled=true})};
 const M=$('mt');M.textContent=mute?'🔇 Effects off':'🔊 Effects on';
 M.onclick=()=>{mute=!mute;ls.set('tr_mute',mute?'1':'0');M.textContent=mute?'🔇 Effects off':'🔊 Effects on'};race();
 $('eq').classList.add('off');$('qq').textContent='Loading clip…';
 beginClip()}
function beginClip(){clearInterval(tick);clearTimeout(wd);started=false;const my=cur;
 const go=()=>{if(started||cur!==my||done||!$('eq'))return;started=true;clearTimeout(wd);fails=0;
  $('eq').classList.remove('off');$('qq').textContent='Which song is playing?';
  t0=performance.now();clearInterval(tick);rr={c:Math.random()<MODES[mode][1],t:2+Math.random()*(LIM*.65),on:0};$('rs').textContent='Rival is listening…';let lt=99;
  tick=setInterval(()=>{const el=(performance.now()-t0)/1000,l=Math.max(0,LIM-el);$('tm').textContent=Math.ceil(l);
   $('rg').style.strokeDashoffset=314.16*(1-l/LIM);
   if(!rr.on&&el>=rr.t){rr.on=1;$('rs').textContent='⚡ Rival locked in!';sfx('lock')}
   if(l<=5){$('rg').classList.add('low');$('tm').classList.add('low');const c=Math.ceil(l);if(c<lt&&c>0){lt=c;sfx('tick')}}
   if(l<=0)pick(null)},100);
  try{(pre=pre||new Audio()).preload='auto';pre.src=up.p}catch(e){}};
 const bad=()=>{if(started||cur!==my||done)return;clearTimeout(wd);
  if(++fails>=4){home('Songs are loading too slowly. Check your connection and try again.');return}next()};
 au.onplaying=go;au.onerror=bad;wd=setTimeout(bad,9000);
 au.src=cur.p;au.load();
 const pr=au.play();
 if(pr&&pr.catch)pr.catch(e=>{if(e&&e.name==='NotAllowedError'&&cur===my&&!started&&$('qq')){clearTimeout(wd);
  $('qq').innerHTML='<button class="btn" id="tp" style="width:auto;padding:10px 22px">▶ Tap to play</button>';$('tp').onclick=()=>au.play()}})}
function pick(x,btn){if(done||!started)return;done=true;clearInterval(tick);au.pause();$('eq').classList.add('off');
 const l=Math.max(0,LIM-(performance.now()-t0)/1000);
 [...$('ops').children].forEach(b=>{if(b._o===cur)b.classList.add('ok')});
 let m;const ok=x===cur;
 if(ok){streak++;mx=Math.max(mx,streak);const p=100+Math.round(l/LIM*150)+(streak>1?streak*10:0);me+=p;m='Correct  +'+p;
  sfx('ok');buzz(30);const R=btn?btn.getBoundingClientRect():null;burst(R?R.left+R.width/2:innerWidth/2,R?R.top+R.height/2:innerHeight/2,40);pop('+'+p);
  const W=['','','Nice!','On fire!','Unstoppable!','LEGENDARY!'];if(streak>1)banner(W[Math.min(streak,5)]+' ×'+streak+' 🔥')}
 else{streak=0;sfx('bad');buzz([60,40,60]);if(btn)btn.classList.add('bad');m=x?'Not quite':'Time’s up';
  app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),450)}
 if(rr.c){const t=Math.min(rr.t,LIM),p=100+Math.round((LIM-t)/LIM*150);rv+=p;m+='  ·  Rival +'+p}else m+='  ·  Rival missed';
 $('rs').textContent=rr.c?'Rival got it':'Rival missed';
 $('fb').textContent=m;rec.push({t:cur.t,a:cur.a,ok});race();
 nt=setTimeout(()=>{r++;next()},2300)}
function finish(){const w=me>rv,t=me===rv,k='tr_best_'+cat,pb=+ls.get(k)||0,nb=me>pb;if(nb)ls.set(k,me);
 const hits=rec.filter(x=>x.ok).length;addStats(w,hits);const st=hits>=ROUNDS*.8?3:hits>=ROUNDS*.5?2:hits>0?1:0;
 view(`<div class="res"><div class="hero"><div class="mark">${w?'♛':t?'＝':'♪'}</div></div>
 <div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><h1>${w?'You win':t?'It’s a tie':'Rival wins'}</h1><p class="tag">${hits}/${ROUNDS} songs named · ${esc(cat)} · ${mode}${nb?' · New best!':''}</p>
 <div class="vs"><div class="${w?'w':''}"><b id="cm">0</b><span>${esc(nm().slice(0,10))}</span></div><div class="${!w&&!t?'w':''}"><b id="cr">0</b><span>Rival</span></div></div>
 <button class="btn" id="ag">Play again</button><div style="height:10px"></div><button class="btn g" id="hm">Choose another section</button>
 <h2 style="text-align:left;margin-top:22px"><span>Recap</span>This round’s songs</h2>
 <div class="rec">${rec.map(x=>`<div><em>${x.ok?'✅':'❌'}</em><span>${esc(x.t)}<small>${esc(x.a)}</small></span></div>`).join('')}</div></div>`);
 count('cm',me);count('cr',rv);if(w){confetti();sfx('win')}else sfx('end');
 $('ag').onclick=()=>load(cat);$('hm').onclick=()=>home()}
ls.get('tr_name')?home():askName(1);
const sp=document.getElementById('sp');let spDone=false;
function hideSp(){if(spDone)return;spDone=true;sp.classList.add('out');setTimeout(()=>sp.remove(),700)}
sp.onclick=hideSp;setTimeout(hideSp,3000);
try{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
